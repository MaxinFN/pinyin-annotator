name: Build & Deploy

# main = 源码真相源（template.html + 构建依赖）。
# push main → 构建四个发布页 → 机器托管 force-push 到 dist 分支（GitHub Pages / Cloudflare Pages / Vercel 的生产分支，禁止手工编辑）。
# push tag v* → 同样构建 → 打包 zip 发布到 GitHub Releases。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build four release pages
        run: node build.js

      - name: Assemble dist
        run: |
          mkdir -p dist
          cp index.html main.html zhuyin.css dist/
          cp mini.html pinyin.html plus.html zhuyin.html dist/
          touch dist/.nojekyll

      - name: Push dist branch (force, machine-managed)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build artifacts from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build four release pages
        run: node build.js

      - name: Package release zip
        run: |
          zip -q -r "pinyin-annotator-${GITHUB_REF_NAME}.zip" \
            index.html main.html zhuyin.css README.md \
            mini.html pinyin.html plus.html zhuyin.html

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pinyin-annotator-*.zip
          generate_release_notes: true
